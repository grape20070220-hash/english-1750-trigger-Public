<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071018"><meta name="description" content="日常・ビジネス英語1750項目を間隔反復で学ぶPWA"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon-192.png"><title>English 1750 Trainer</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=5"></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">EN</div><div><h1>English 1750 Trainer</h1><p>日常900 + Business600 + 熟語250</p></div></div><nav class="nav" id="nav"><button data-page="dashboard" class="active"><span class="ico">⌂</span>ダッシュボード</button><button data-page="tests"><span class="ico">✎</span>単語テスト</button><button data-page="vocab"><span class="ico">▤</span>単語帳</button><button data-page="review"><span class="ico">↻</span>復習キュー</button><button data-page="stats"><span class="ico">▥</span>学習記録</button><button data-page="settings"><span class="ico">⚙</span>設定</button></nav><div class="side-foot">学習データはこのブラウザに保存。<br>PDFの全1,750項目を収録済み</div></aside>
<main class="main"><div class="topbar"><div><div class="eyebrow" id="eyebrow">Study dashboard</div><h2 class="page-title" id="pageTitle">ダッシュボード</h2></div><div class="top-actions"><button class="btn mobile-menu" id="mobileNav">☰</button><button class="btn" id="installAppBtn" hidden>＋ <span>アプリ化</span></button><button class="btn" id="pushBell">🔔 <span>通知</span></button><button class="btn" id="speakHelp">🔊 <span>音声確認</span></button><button class="btn primary" id="quickReview">復習を開始</button></div></div><section id="page-dashboard" class="page"></section><section id="page-tests" class="page hidden"></section><section id="page-test-run" class="page hidden"></section><section id="page-vocab" class="page hidden"></section><section id="page-review" class="page hidden"></section><section id="page-stats" class="page hidden"></section><section id="page-settings" class="page hidden"></section></main></div><div class="toast" id="toast"></div><div id="pushDiag" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:12px 14px;border-radius:12px;background:#102231;color:#fff;font:14px/1.45 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35)"></div>
<script src="config.js?v=5"></script><script src="data-00.js"></script><script src="data-01.js"></script><script src="data-02.js"></script><script src="data-03.js"></script><script src="data-04.js"></script><script src="data-05.js"></script><script src="app.js?v=5"></script><script>(()=>{
const cfg=window.ENGLISH1750_CONFIG||{},api=String(cfg.dataApiUrl||'').replace(/\/$/,''),token=String(cfg.dataApiToken||''),vapid=String(cfg.vapidPublicKey||'');
const diag=document.getElementById('pushDiag');
function status(msg,ok=false){if(!diag)return;diag.style.display='block';diag.style.background=ok?'#123b2e':'#402226';diag.textContent=msg;try{localStorage.setItem('english1750_push_diag_v1',msg)}catch{}}
function b64(s){const pad='='.repeat((4-s.length%4)%4),raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a}
function devToken(){try{if(typeof getPushDeviceToken==='function')return getPushDeviceToken()}catch{}let k='english1750_push_device_token_v1',t=localStorage.getItem(k);if(!t){t=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36));localStorage.setItem(k,t)}return t}
async function rpc(name,args){const r=await fetch(`${api}/rpc/${name}`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(args)});const txt=await r.text();if(!r.ok)throw new Error(`RPC ${name}: HTTP ${r.status} ${txt.slice(0,160)}`);try{return JSON.parse(txt)}catch{return txt}}
async function registerPush(userGesture=false){
  try{
    if(!window.isSecureContext)throw new Error('HTTPSではありません');
    if(!('serviceWorker'in navigator))throw new Error('Service Worker未対応です。Chromeで開いてください');
    if(!('PushManager'in window))throw new Error('Web Push未対応ブラウザです。右上メニューからChromeで開いてください');
    if(!('Notification'in window))throw new Error('通知API未対応ブラウザです。Chromeで開いてください');
    if(!api||!token||!vapid)throw new Error('通知設定ファイルが不足しています');
    let permission=Notification.permission;
    if(permission==='default'&&userGesture)permission=await Notification.requestPermission();
    if(permission==='default')throw new Error('通知許可がまだです。🔔通知を押してください');
    if(permission!=='granted')throw new Error('通知が拒否されています。Chromeのサイト設定で通知を許可してください');
    status('通知登録を確認中…');
    const reg=await navigator.serviceWorker.register('./sw.js?v=5',{scope:'./'});
    await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(vapid)});
    const due=typeof dueTimesForPush==='function'?dueTimesForPush():[];
    const prefs=(window.settings&&settings.notifications)?settings.notifications:{enabled:true,dueAlerts:true,morningEnabled:false,morningTime:'07:30',eveningEnabled:true,eveningTime:'20:00',badge:true};
    const payload={p_device_token:devToken(),p_subscription:sub.toJSON?sub.toJSON():sub,p_prefs:{...prefs,enabled:true},p_due_times:due,p_timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Tokyo'};
    await rpc('sync_push_device',payload);
    if(window.settings){settings.notifications.enabled=true;try{saveSettings()}catch{}}
    try{updatePushBell()}catch{}
    status('✅ 通知端末の登録完了',true);
    return true;
  }catch(e){console.error('Direct push registration failed',e);status('❌ '+String(e&&e.message||e).slice(0,180));return false}
}
window.__english1750RegisterPush=registerPush;
const bell=document.getElementById('pushBell');if(bell)bell.onclick=async()=>{bell.disabled=true;const old=bell.innerHTML;bell.innerHTML='⏳ <span>設定中</span>';try{await registerPush(true)}finally{bell.disabled=false;try{updatePushBell()}catch{bell.innerHTML=old}}};
setTimeout(()=>registerPush(false),1500);
})();</script></body></html>
