<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071018"><meta name="description" content="日常・ビジネス英語1750項目を間隔反復で学ぶPWA"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon-192.png"><title>English 1750 Trainer</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">EN</div><div><h1>English 1750 Trainer</h1><p>日常900 + Business600 + 熟語250</p></div></div><nav class="nav" id="nav"><button data-page="dashboard" class="active"><span class="ico">⌂</span>ダッシュボード</button><button data-page="tests"><span class="ico">✎</span>単語テスト</button><button data-page="vocab"><span class="ico">▤</span>単語帳</button><button data-page="review"><span class="ico">↻</span>復習キュー</button><button data-page="stats"><span class="ico">▥</span>学習記録</button><button data-page="settings"><span class="ico">⚙</span>設定</button></nav><div class="side-foot">学習データはこのブラウザに保存。<br>PDFの全1,750項目を収録済み</div></aside>
<main class="main"><div class="topbar"><div><div class="eyebrow" id="eyebrow">Study dashboard</div><h2 class="page-title" id="pageTitle">ダッシュボード</h2></div><div class="top-actions"><button class="btn mobile-menu" id="mobileNav">☰</button><button class="btn" id="installAppBtn" hidden>＋ <span>アプリ化</span></button><button class="btn" id="pushBell">🔔 <span>通知</span></button><button class="btn" id="speakHelp">🔊 <span>音声確認</span></button><button class="btn primary" id="quickReview">復習を開始</button></div></div><section id="page-dashboard" class="page"></section><section id="page-tests" class="page hidden"></section><section id="page-test-run" class="page hidden"></section><section id="page-vocab" class="page hidden"></section><section id="page-review" class="page hidden"></section><section id="page-stats" class="page hidden"></section><section id="page-settings" class="page hidden"></section></main></div><div class="toast" id="toast"></div>
<script src="config.js"></script><script src="data-00.js"></script><script src="data-01.js"></script><script src="data-02.js"></script><script src="data-03.js"></script><script src="data-04.js"></script><script src="data-05.js"></script><script src="app.js"></script><script>(()=>{const cfg=window.ENGLISH1750_CONFIG||{},api=String(cfg.dataApiUrl||'').replace(/\/$/,''),token=String(cfg.dataApiToken||'');if(api&&token&&typeof neonRpc==='function'){neonRpc=async function(name,args={}){const r=await fetch(`${api}/rpc/${name}`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(args)});if(!r.ok){let detail='';try{detail=await r.text()}catch{}throw new Error(`Neon RPC ${name} failed: ${r.status} ${detail}`)}try{return await r.json()}catch{return{ok:true}}}}
if(typeof enablePush==='function'){enablePush=async function(){try{if(location.protocol==='file:')throw new Error('HTTPS公開版で利用してください');if(!pushSupported())throw new Error('このブラウザはWeb Pushに対応していません');if(!VAPID_PUBLIC_KEY)throw new Error('VAPID公開鍵がありません');let permission=Notification.permission;if(permission!=='granted')permission=await Notification.requestPermission();if(permission!=='granted')throw new Error('通知が許可されていません');let reg=swRegistration||await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});settings.notifications.enabled=true;saveSettings();await neonRpc('sync_push_device',rpcPushPayload(sub));updatePushBell();toast('通知ON・端末登録完了');if(typeof renderSettings==='function'&&currentPage==='settings')renderSettings();return true}catch(e){console.error('Push registration failed',e);settings.notifications.enabled=false;saveSettings();const msg=String(e&&e.message||e||'不明なエラー').slice(0,120);toast('通知登録失敗: '+msg);if(typeof renderSettings==='function'&&currentPage==='settings')renderSettings();return false}}}
const bell=document.getElementById('pushBell');if(bell)bell.onclick=async()=>{if(typeof Notification!=='undefined'&&Notification.permission==='denied'){toast('通知が拒否されています。Chromeのサイト設定 → 通知 から許可してください');return}bell.disabled=true;bell.innerHTML='⏳ <span>設定中</span>';try{if(typeof enablePush==='function')await enablePush();else if(typeof go==='function')go('settings')}finally{bell.disabled=false;updatePushBell()}};
setTimeout(async()=>{try{if(typeof Notification==='undefined'||Notification.permission!=='granted'||typeof enablePush!=='function')return;await enablePush()}catch(e){console.warn('Push auto-recovery failed',e)}},1200)})();</script></body></html>
