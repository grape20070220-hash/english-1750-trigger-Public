<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#111827}button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:22px 16px}.brand{font-size:22px;font-weight:900;margin-bottom:22px}.nav{display:grid;gap:7px}.nav button{border:0;border-radius:12px;padding:12px;text-align:left;background:transparent;color:#d1d5db;font-weight:700}.nav button.on,.nav button:hover{background:#1f2937;color:#fff}main{max-width:1100px;width:100%;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.head h1{margin:0;font-size:clamp(28px,4vw,42px)}.head p{margin:5px 0;color:#6b7280}.pill{background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:9px 13px;font-weight:800;white-space:nowrap}.grid{display:grid;gap:13px}.g3{grid-template-columns:repeat(3,1fr)}.topics{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid #e5e7eb;border-radius:19px;padding:19px;box-shadow:0 12px 30px #11182710}.stat b{font-size:30px;display:block}.stat small,.muted{color:#6b7280}.hero{background:#111827;color:#fff;margin-top:13px}.hero p{color:#d1d5db;line-height:1.7}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800}.primary{background:#2563eb;color:#fff}.primary:disabled{opacity:.55;cursor:wait}.ghost{background:#fff;color:#111827;border:1px solid #e5e7eb}.topic{display:grid;grid-template-columns:45px 1fr auto;gap:11px;align-items:center}.ico{width:45px;height:45px;border-radius:13px;background:#eff6ff;display:grid;place-items:center;font-size:22px}.topic h3{margin:0}.topic p{margin:4px 0 0;color:#6b7280;font-size:13px}.bar{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:7px}.bar.big{height:10px;margin-bottom:18px}.bar i{display:block;height:100%;background:#2563eb}.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.step{padding:7px 9px;border-radius:99px;background:#e5e7eb;color:#6b7280;font-size:12px;font-weight:900}.step.on{background:#dbeafe;color:#1d4ed8}.step.done{background:#dcfce7;color:#15803d}.rule{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:15px;line-height:1.7}.q{font-size:21px;line-height:1.5;margin:16px 0}.opts{display:grid;gap:8px}.opt{padding:13px;border:1.5px solid #e5e7eb;border-radius:13px;background:#fff;text-align:left;font-weight:700}.opt.ok{border-color:#22c55e;background:#f0fdf4}.opt.ng{border-color:#ef4444;background:#fef2f2}.feed{margin-top:12px;padding:12px;border-radius:12px}.feed.ok{background:#f0fdf4;color:#166534}.feed.ng{background:#fef2f2;color:#991b1b}.input{width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:12px}.pass{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.85;border:1px solid #e5e7eb;border-radius:14px;padding:18px;background:#fff}.review{padding:13px 0;border-bottom:1px solid #e5e7eb}.review:last-child{border-bottom:0}.review.upcoming{display:flex;justify-content:space-between;align-items:center;gap:12px}.hidden{display:none!important}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#f3f4f6;color:#4b5563}.badge.ai{background:#ede9fe;color:#6d28d9}.install{border:1px solid #bfdbfe;background:#eff6ff}.install h3{margin:0 0 6px}.install p{margin:5px 0 12px;color:#475569;line-height:1.55}.spinner{width:22px;height:22px;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:white;padding:11px 16px;border-radius:12px;z-index:99;box-shadow:0 12px 30px #0004;max-width:min(90vw,520px)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#2563eb}.small-note{font-size:12px;margin-bottom:0}.review-home{margin-top:13px;border:1px solid #bfdbfe}.roadmap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.roadmap span{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#eff6ff;color:#1d4ed8;padding:7px 10px;font-weight:800;font-size:12px}.roadmap span b{width:20px;height:20px;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:11px}.roadmap i{font-style:normal;color:#94a3b8}.book-intro{margin-bottom:14px;background:#fffbeb;border-color:#fde68a}.book-intro p{margin-bottom:0;line-height:1.7}.chapter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.chapter-card{border:1px solid #e5e7eb;border-radius:16px;padding:16px;background:#fff}.chapter-card.completed{border-color:#86efac;background:#f0fdf4}.chapter-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.chapter-num{font-size:11px;font-weight:900;letter-spacing:.09em;color:#94a3b8;margin-top:12px}.chapter-card h3{margin:5px 0 7px}.chapter-card p{color:#64748b;line-height:1.55;min-height:48px}.level{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;background:#e0e7ff;color:#3730a3}.l3,.l4{background:#dbeafe;color:#1d4ed8}.l5,.l6{background:#fef3c7;color:#92400e}.l7,.l8{background:#fee2e2;color:#991b1b}.done-mark{font-size:12px;font-weight:900;color:#15803d}.book{padding:clamp(20px,4vw,36px)}.book>h2{font-size:clamp(25px,4vw,36px);margin:5px 0 18px}.formula{border-radius:16px;background:#111827;color:#fff;padding:15px 17px;margin:0 0 22px}.formula span{display:block;font-size:11px;letter-spacing:.12em;color:#93c5fd;font-weight:900;margin-bottom:5px}.formula strong{font-size:18px}.book-section{padding:18px 0;border-top:1px solid #e5e7eb}.book-section h3{margin:0 0 8px;font-size:19px}.book-section p,.book-section li{line-height:1.8;color:#334155}.examples{display:grid;gap:10px}.example{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;padding:12px}.ex-no{width:26px;height:26px;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px}.example b{display:block;margin-bottom:4px}.example small{display:block;color:#64748b;margin-top:4px}.speak-mini{border:0;background:transparent;font-size:18px}.warning{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:15px;margin:8px 0}.warning ul{margin:6px 0 0;padding-left:22px}.recap{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:15px;margin:8px 0 18px}.review-guide{margin-bottom:15px}.review-guide h2{font-size:clamp(18px,3vw,26px)}.progress-row{padding:12px 0;border-bottom:1px solid #e5e7eb}.progress-row:last-child{border-bottom:0}
@media(max-width:820px){.app{display:block}.side{position:sticky;top:0;z-index:4;padding:9px}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}main{padding:20px 14px calc(55px + env(safe-area-inset-bottom))}.g3,.topics,.chapter-grid{grid-template-columns:1fr}.topic{grid-template-columns:45px 1fr}.topic .btn{grid-column:1/-1}.head{align-items:flex-start}.pill{font-size:12px}.chapter-card p{min-height:auto}.roadmap i{display:none}.review-home .row{align-items:stretch}.review-home .btn{width:100%}}
</style></head><body>
