<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="英文法を理解・4択・英作文・短文読解・間隔復習で定着させる学習PWA">
<meta name="grammarloop-build" content="2026-08-20-git-auto-test">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="GrammarLoop">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<title>GrammarLoop</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#111827}button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:22px 16px}.brand{font-size:22px;font-weight:900;margin-bottom:22px}.nav{display:grid;gap:7px}.nav button{border:0;border-radius:12px;padding:12px;text-align:left;background:transparent;color:#d1d5db;font-weight:700}.nav button.on,.nav button:hover{background:#1f2937;color:#fff}main{max-width:1050px;width:100%;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.head h1{margin:0;font-size:clamp(28px,4vw,42px)}.head p{margin:5px 0;color:#6b7280}.pill{background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:9px 13px;font-weight:800;white-space:nowrap}.grid{display:grid;gap:13px}.g3{grid-template-columns:repeat(3,1fr)}.topics{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid #e5e7eb;border-radius:19px;padding:19px;box-shadow:0 12px 30px #11182710}.stat b{font-size:30px;display:block}.stat small,.muted{color:#6b7280}.hero{background:#111827;color:#fff;margin-top:13px}.hero p{color:#d1d5db;line-height:1.7}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800}.primary{background:#2563eb;color:#fff}.primary:disabled{opacity:.55;cursor:wait}.ghost{background:#fff;color:#111827;border:1px solid #e5e7eb}.topic{display:grid;grid-template-columns:45px 1fr auto;gap:11px;align-items:center}.ico{width:45px;height:45px;border-radius:13px;background:#eff6ff;display:grid;place-items:center;font-size:22px}.topic h3{margin:0}.topic p{margin:4px 0 0;color:#6b7280;font-size:13px}.bar{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#2563eb}.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.step{padding:7px 9px;border-radius:99px;background:#e5e7eb;color:#6b7280;font-size:12px;font-weight:900}.step.on{background:#dbeafe;color:#1d4ed8}.step.done{background:#dcfce7;color:#15803d}.rule{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:15px;line-height:1.7}.q{font-size:21px;line-height:1.5;margin:16px 0}.opts{display:grid;gap:8px}.opt{padding:13px;border:1.5px solid #e5e7eb;border-radius:13px;background:#fff;text-align:left;font-weight:700}.opt.ok{border-color:#22c55e;background:#f0fdf4}.opt.ng{border-color:#ef4444;background:#fef2f2}.feed{margin-top:12px;padding:12px;border-radius:12px}.feed.ok{background:#f0fdf4;color:#166534}.feed.ng{background:#fef2f2;color:#991b1b}.feed.info{background:#eff6ff;color:#1e40af}.input{width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:12px}.pass{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.85;border:1px solid #e5e7eb;border-radius:14px;padding:18px;background:#fff}.review{padding:13px 0;border-bottom:1px solid #e5e7eb}.hidden{display:none!important}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#f3f4f6;color:#4b5563}.badge.ai{background:#ede9fe;color:#6d28d9}.install{border:1px solid #bfdbfe;background:#eff6ff}.install h3{margin:0 0 6px}.install p{margin:5px 0 12px;color:#475569;line-height:1.55}.spinner{width:22px;height:22px;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:white;padding:11px 16px;border-radius:12px;z-index:99;box-shadow:0 12px 30px #0004;max-width:min(90vw,520px)}
@media(max-width:820px){.app{display:block}.side{position:sticky;top:0;z-index:4;padding:9px}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}main{padding:20px 14px calc(55px + env(safe-area-inset-bottom))}.g3,.topics{grid-template-columns:1fr}.topic{grid-template-columns:45px 1fr}.topic .btn{grid-column:1/-1}.head{align-items:flex-start}.pill{font-size:12px}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand">GrammarLoop</div><nav class="nav"><button class="on" data-v="home">🏠 ホーム</button><button data-v="topics">📚 文法</button><button data-v="review">🔁 復習</button><button data-v="stats">📊 記録</button></nav></aside><main id="m"></main></div>
<script src="/data.js" defer></script><script src="/app.js" defer></script></body></html>
