name: Push Registration CORS Check

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cors-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check browser preflight and authenticated RPC
        shell: bash
        run: |
          set -euo pipefail
          API='https://ep-gentle-flower-axl1t1zm.apirest.c-4.us-east-2.aws.neon.tech/neondb/rest/v1'
          ORIGIN='https://grape20070220-hash.github.io'
          TOKEN="$(python3 - <<'PY'
import re
s=open('site/config.js',encoding='utf-8').read()
m=re.search(r"dataApiToken:'([^']+)'",s)
assert m, 'dataApiToken missing'
print(m.group(1))
PY
)"
          echo "::add-mask::$TOKEN"
          curl --fail --silent --show-error -X OPTIONS \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            "$API/rpc/sync_push_device" >/dev/null

          DEV="browser-smoke-$(date +%s)-0123456789abcdef"
          ENDPOINT="https://example.invalid/push/$DEV"
          body="$(mktemp)"
          code="$(curl --silent --show-error -X POST \
            -H "Origin: $ORIGIN" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "{\"p_device_token\":\"$DEV\",\"p_subscription\":{\"endpoint\":\"$ENDPOINT\",\"keys\":{\"p256dh\":\"fake\",\"auth\":\"fake\"}},\"p_prefs\":{\"enabled\":true},\"p_due_times\":[],\"p_timezone\":\"Asia/Tokyo\"}" \
            --output "$body" --write-out '%{http_code}' \
            "$API/rpc/sync_push_device")"
          echo "sync_status=$code"
          cat "$body"; echo
          test "$code" = '200'

          cleanup="$(mktemp)"
          code2="$(curl --silent --show-error -X POST \
            -H "Origin: $ORIGIN" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "{\"p_device_token\":\"$DEV\"}" \
            --output "$cleanup" --write-out '%{http_code}' \
            "$API/rpc/unsubscribe_push_device")"
          echo "cleanup_status=$code2"
          cat "$cleanup"; echo
          test "$code2" = '200'
