name: English 1750 Push Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-1750-push
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check secret
        if: env.DATABASE_URL == ''
        run: echo 'DATABASE_URL secret is not configured yet; skipping push delivery.'
      - name: Install dependencies
        if: env.DATABASE_URL != ''
        run: npm install --no-audit --no-fund
      - name: Send due notifications
        if: env.DATABASE_URL != ''
        run: node scripts/send-notifications.mjs
