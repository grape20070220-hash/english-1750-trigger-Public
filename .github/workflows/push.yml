name: English 1750 Secure Push Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push.yml'
      - 'scripts/send-notifications-oidc.mjs'
      - 'package.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: english-1750-secure-push
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install push sender
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          response="$(curl --fail --show-error --silent \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=english1750-scheduler")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Send due review notifications
        env:
          DATA_API_URL: https://ep-gentle-flower-axl1t1zm.apirest.c-4.us-east-2.aws.neon.tech/neondb/rest/v1
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node scripts/send-notifications-oidc.mjs

