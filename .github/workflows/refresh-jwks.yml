name: Refresh English 1750 JWKS

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-jwks.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Merge RS256 client key with current GitHub OIDC keys
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent https://token.actions.githubusercontent.com/.well-known/jwks -o /tmp/github-jwks.json
          jq -n --slurpfile gh /tmp/github-jwks.json \
            '{keys: ([{"kty":"RSA","alg":"RS256","use":"sig","kid":"english1750-client-rsa-v1","n":"2mGef7eZV-i0BoYjYnNTVEhMbLJIdQu4UkAy7agSC-wYhOmWc42-sKXBLg4wEHVU0G2k10Hce0XBDFZRLNDMDsTX2yMBm6mXdDRiAWg7eb-ZPM6TOXwoYcoDIb9cxv9_hnXR7AsMdXSMK1ycxVmwB1aNeJqEjeuNcAcNSaapy7qXZq-ysE-2lYi-6CAOkx4t-HkK72x9IBCLcRjHHQE6bunqtZBbHsKcdQ8YLkRf13XgJVERLKY0x1LEkf24BcvyoFCew7NczerPhLvXHEzuOx1OZuFc8kNiJbTYhACAtwCzivPnO0EzU5a91iEb_xHZ_HgNXDqqr12OouUqukHMbQ","e":"AQAB"}] + [$gh[0].keys[] | select(.alg == "RS256")])}' \
            > site/jwks-v3.json
          jq -e '.keys | (length >= 2) and all(.[]; .alg == "RS256")' site/jwks-v3.json >/dev/null
      - name: Commit JWKS rotation if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/jwks-v3.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh RS256 GitHub OIDC JWKS'
          git push
