name: English 1750 UI Smoke

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui-smoke.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check app JavaScript syntax
        run: node --check site/app.js
      - name: Compare expected UI functions
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('site/app.js','utf8');
          const got=new Set([...s.matchAll(/(?:async\s+)?function\s+([A-Za-z0-9_]+)/g)].map(m=>m[1]));
          const expected=`answerChoice checkTyped choiceHtml coreJa disablePush drawVocabRows dueTimesForPush dueWords enablePush escapeAttr escapeHtml exportProgress filterPool finishAnswer fmtDue getPushDeviceToken getPushSubscription getWord go importProgress initPWA installApp isDue isMastered levenshtein loadSettings loadState makeOptions masteryPct modeCard nextQuestion normalizeEn normalizeJa notificationSettingsCard onePoint openMobileNav previewVoice pushPayload pushStatusText pushSupported record render renderDashboard renderQuestion renderReview renderSessionDone renderSettings renderStats renderTests renderVocab resetProgress saveNotificationForm saveSettingForm saveSettings saveState schedulePushSync sectionLabel selectMode setSt shuffle similarity speak speakCurrent st startConfiguredTest startQuickReview startRecognition startSession submitTyped summary syncPushState testPushNotification testSettingVoice toast toggleFav toggleFavCurrent typedHtml updateBadge updatePushBell urlBase64ToUint8Array vocabFiltered`.split(/\s+/);
          const missing=expected.filter(x=>!got.has(x));
          console.log('FUNCTION_COUNT='+got.size);
          console.log('MISSING='+missing.join(' '));
          NODE
      - name: Check all 1750 vocabulary items load
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}}; vm.createContext(ctx);
          for(let i=0;i<6;i++){
            const p=`site/data-${String(i).padStart(2,'0')}.js`;
            vm.runInContext(fs.readFileSync(p,'utf8'),ctx,{filename:p});
          }
          const n=ctx.window.WORDS?.length||0;
          console.log('WORDS='+n);
          if(n!==1750) process.exit(1);
          NODE
      - name: Run browser-like dashboard initialization
        shell: bash
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          let html=fs.readFileSync('site/index.html','utf8').replace(/<script[\s\S]*?<\/script>/g,'');
          const dom=new JSDOM(html,{url:'https://grape20070220-hash.github.io/english-1750-trigger-Public/',runScripts:'outside-only'});
          const w=dom.window;
          w.scrollTo=()=>{};w.prompt=()=>null;w.confirm=()=>false;
          w.speechSynthesis={cancel(){},getVoices(){return[]},speak(){}};w.SpeechSynthesisUtterance=function(t){this.text=t};
          w.Notification={permission:'granted',requestPermission:async()=> 'granted'};
          Object.defineProperty(w.navigator,'serviceWorker',{value:undefined,configurable:true});
          const evalFile=p=>w.eval(fs.readFileSync(p,'utf8')+`\n//# sourceURL=${p}`);
          evalFile('site/config.js');for(let i=0;i<6;i++)evalFile(`site/data-${String(i).padStart(2,'0')}.js`);
          console.log('WORDS before app=',w.WORDS?.length);
          try{evalFile('site/app.js')}catch(e){console.error('APP_RUNTIME_ERROR',e&&e.stack||e);process.exit(2)}
          const dashboard=w.document.getElementById('page-dashboard');
          console.log('dashboard_chars=',dashboard.innerHTML.length);console.log('quickReview_handler=',typeof w.document.getElementById('quickReview').onclick);
          if(dashboard.innerHTML.length<500||typeof w.document.getElementById('quickReview').onclick!=='function')process.exit(5);
          NODE
